<mat-card class="audit-container">
  <mat-card-header>
    <mat-card-title>
      <h2>Registro de Auditoria</h2>
    </mat-card-title>
  </mat-card-header>

  <mat-card-content>
    <form [formGroup]="filterForm" class="filters-container">
      <mat-form-field appearance="outline">
        <mat-label>Email</mat-label>
        <input matInput formControlName="email" placeholder="Filtrar por email">
        <mat-icon matSuffix>email</mat-icon>
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Data Inicial</mat-label>
        <input matInput [matDatepicker]="startPicker" formControlName="dateStart">
        <mat-datepicker-toggle matSuffix [for]="startPicker"></mat-datepicker-toggle>
        <mat-datepicker #startPicker></mat-datepicker>
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Data Final</mat-label>
        <input matInput [matDatepicker]="endPicker" formControlName="dateEnd">
        <mat-datepicker-toggle matSuffix [for]="endPicker"></mat-datepicker-toggle>
        <mat-datepicker #endPicker></mat-datepicker>
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Tipo de Ação</mat-label>
        <mat-select formControlName="action">
          <mat-option value="">Todos</mat-option>
          <mat-option *ngFor="let action of actionTypes" [value]="action">
            {{action}}
          </mat-option>
        </mat-select>
      </mat-form-field>
    </form>

    <div class="button-container">
      <button mat-raised-button color="warn" (click)="clearFilters()">
        <mat-icon>clear</mat-icon>
        Limpar Filtros
      </button>
      <button mat-raised-button color="primary" (click)="exportToExcel()" [disabled]="isExporting">
        <mat-icon>download</mat-icon>
        Exportar para Excel
      </button>
    </div>

    <div class="table-container mat-elevation-z8">
      <div *ngIf="isLoading" class="loading-spinner">
        <mat-spinner></mat-spinner>
      </div>

      <table mat-table [dataSource]="dataSource" matSort (matSortChange)="sortData($event)" *ngIf="!isLoading">
        <ng-container matColumnDef="email">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>Email</th>
          <td mat-cell *matCellDef="let element">{{element.email}}</td>
        </ng-container>

        <ng-container matColumnDef="data">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>Data</th>
          <td mat-cell *matCellDef="let element">{{formatTimestamp(element.data)}}</td>
        </ng-container>

        <ng-container matColumnDef="acao">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>Ação</th>
          <td mat-cell *matCellDef="let element">
            <span class="action-badge" [ngClass]="element.acao.toLowerCase()">
              {{element.acao}}
            </span>
          </td>
        </ng-container>

        <ng-container matColumnDef="conteudo">
          <th mat-header-cell *matHeaderCellDef>Conteúdo</th>
          <td mat-cell *matCellDef="let element">{{element.conteudo}}</td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
      </table>

      <mat-paginator
        [pageSizeOptions]="[5, 10, 25, 100]"
        showFirstLastButtons
        aria-label="Selecione a página de registros de auditoria">
      </mat-paginator>
    </div>
  </mat-card-content>
</mat-card>
